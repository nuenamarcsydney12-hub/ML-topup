{% extends "base.html" %}
{% block title %}Register - ML TopUp Lite{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h2>Create a Customer Account</h2>
    <form method="POST" action="{{ url_for('auth.register') }}" class="form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" value="{{ name }}" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6">
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
  </div>
</section>
{% endblock %}
